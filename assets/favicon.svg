<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente professionale: Blu profondo a Ciano -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" /> <!-- Blu primario -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Ciano -->
    </linearGradient>
    
    <!-- Ombra morbida per profondità -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sfondo (opzionale, rimuovi se vuoi trasparente) -->
  <rect width="200" height="200" rx="40" fill="#F8FAFC" />

  <!-- Forma principale: Nodo/Monogramma astratto -->
  <g filter="url(#shadow)">
    <!-- Arco esterno (Rappresenta struttura e cicli di sviluppo) -->
    <path d="M 100 30 A 70 70 0 1 1 30 100" 
          fill="none" stroke="url(#proGrad)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Linea diagonale (Rappresenta progresso e connessione) -->
    <line x1="55" y1="145" x2="145" y2="55" 
          stroke="#0F172A" stroke-width="16" stroke-linecap="round" />
          
    <!-- Punto di connessione (Rappresenta il nodo/dati) -->
    <circle cx="100" cy="100" r="12" fill="#F8FAFC" stroke="#0F172A" stroke-width="6" />
  </g>
</svg>